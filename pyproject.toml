[project]
name = "clip-cognition"
version = "0.1.0"
description = "Intelligent media processing and video RAG using Azure OpenAI & Cosmos DB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-cosmos>=4.15.0",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.28.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "moviepy>=2.0.0",
    "openai>=2.29.0",
    "opencv-python==4.10.0.84",
    "pillow>=9.2.0",
    "pydantic>=2.12.5",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "requests>=2.32.5",
    "tenacity>=9.1.4",
    "tiktoken>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
clip-cognition = "api.main:app"
